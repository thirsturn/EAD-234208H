services:
  mysql:
    image: mysql:8.0
    container_name: library-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: library_db
      MYSQL_ROOT_PASSWORD: 91967910
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p91967910 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ead
    container_name: library-api
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_NAME: library_db
      DB_USERNAME: root
      DB_PASSWORD: 91967910
    restart: on-failure

volumes:
  mysql_data:
